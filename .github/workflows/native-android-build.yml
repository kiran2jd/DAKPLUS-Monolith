name: Native Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: 🛠 Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: 🚀 Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: 📦 Build App Bundle (AAB)
        working-directory: mobile/android
        run: ./gradlew bundleRelease

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-stable-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

      - name: 📤 Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-playstore-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab

      - name: 🔗 Generate Public Share Link
        run: |
          # Disable exit on error temporarily
          set +e
          
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Uploading $APK_PATH..."
          
          if [ -z "$APK_PATH" ]; then
            echo "No APK found to upload!"
            exit 0
          fi
          
          # Try bashupload first as it's more reliable for CI runners
          echo "Trying bashupload.com..."
          BASH_URL=$(curl -s -T "$APK_PATH" https://bashupload.com/dakplus-app.apk | grep -o 'https://bashupload.com/[a-zA-Z0-9_-]*')
          
          if [ -n "$BASH_URL" ]; then
            echo "----------------------------------------------------------------"
            echo "PUBLIC DOWNLOAD LINK: $BASH_URL"
            echo "----------------------------------------------------------------"
          else
            echo "bashupload failed, trying file.io..."
            RESPONSE=$(curl -s -F "file=@$APK_PATH" https://file.io)
            # Safely parse JSON
            DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.link // empty' 2>/dev/null)
            
            if [ -n "$DOWNLOAD_URL" ]; then
              echo "----------------------------------------------------------------"
              echo "PUBLIC DOWNLOAD LINK: $DOWNLOAD_URL"
              echo "Note: This link works for ONE download only for security."
              echo "----------------------------------------------------------------"
            else
              echo "Failed to generate public share link from both providers."
            fi
          fi
          
          # Re-enable exit on error
          set -e
