name: Native Android Build (APK + AAB)
on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: 🛠 Prebuild (Generate Android folder)
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: 🚀 Build Release APK
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📦 Build Release AAB (Play Store)
        working-directory: mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew bundleRelease

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-playstore-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 🔗 Generate Public Download Link for APK
        run: |
          set +e
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 0
          fi

          echo "✅ APK found: $APK_PATH"
          FILE_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "📦 APK Size: $FILE_SIZE"

          echo "Uploading to bashupload.com..."
          BASH_URL=$(curl -s --max-time 60 -T "$APK_PATH" https://bashupload.com/dakplus-app.apk | grep -oP 'https://bashupload\.com/[^\s]+')

          if [ -n "$BASH_URL" ]; then
            echo "================================================================"
            echo "✅ APK PUBLIC DOWNLOAD LINK:"
            echo "   $BASH_URL"
            echo "================================================================"
          else
            echo "bashupload failed, trying file.io..."
            RESPONSE=$(curl -s --max-time 60 -F "file=@$APK_PATH" https://file.io)
            DOWNLOAD_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('link',''))" 2>/dev/null)

            if [ -n "$DOWNLOAD_URL" ]; then
              echo "================================================================"
              echo "✅ APK PUBLIC DOWNLOAD LINK (single use):"
              echo "   $DOWNLOAD_URL"
              echo "================================================================"
            else
              echo "⚠️  Could not generate public link. Download from GitHub Artifacts above."
            fi
          fi
          set -e
