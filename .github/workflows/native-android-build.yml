name: Native Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: 🛠 Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: 🚀 Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-stable-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: 🔗 Generate Public Share Link (14-day expiry)
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Uploading $APK_PATH to transfer.sh..."
          curl --upload-file "$APK_PATH" https://transfer.sh/dakplus-app.apk > download_link.txt
          echo "DOWNLOAD_URL=$(cat download_link.txt)" >> $GITHUB_ENV
          echo "----------------------------------------------------------------"
          echo "PUBLIC DOWNLOAD LINK: $(cat download_link.txt)"
          echo "----------------------------------------------------------------"
