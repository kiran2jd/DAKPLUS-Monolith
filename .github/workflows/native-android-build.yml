name: Native Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npx expo install --check

      - name: 🛠 Prebuild
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: 🚀 Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: 📤 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dakplus-stable-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk

      - name: 🔗 Generate Public Share Link
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Uploading $APK_PATH..."
          
          # Try file.io (very reliable)
          RESPONSE=$(curl -s -F "file=@$APK_PATH" https://file.io)
          DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.link')
          
          if [ "$DOWNLOAD_URL" != "null" ] && [ -n "$DOWNLOAD_URL" ]; then
            echo "----------------------------------------------------------------"
            echo "PUBLIC DOWNLOAD LINK: $DOWNLOAD_URL"
            echo "Note: This link works for ONE download only for security."
            echo "----------------------------------------------------------------"
          else
            echo "file.io failed, trying bashupload..."
            BASH_URL=$(curl -s -T "$APK_PATH" https://bashupload.com/dakplus-app.apk)
            echo "----------------------------------------------------------------"
            echo "PUBLIC DOWNLOAD LINK (Fallback): $BASH_URL"
            echo "----------------------------------------------------------------"
          fi
